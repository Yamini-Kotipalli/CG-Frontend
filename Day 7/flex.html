
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code with Yamini</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            display: flex;
            padding: 50px;
            align-items: center;
            gap: 150px;
        }
        .h1{
            text-align: center;
        }

        .left,
        .right {
            flex: 1;
        }

        .image {
            width: 300px;
            height: 300px;
            max-width: 100%;
        }

        .btn {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            justify-content: center;
        }
        .btn:hover {
            transform: scale(1.1);
        }
        .btn1 {
            background-color: whitesmoke;
            color: black;
            border: 1px solid black;
            padding: 10px 20px;
            cursor: pointer;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .btn1:hover{
            transform: scale(1.1);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .left {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 30px;
            }

            .p {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="left">
            <h1>Code with Yamini</h1>

            <p class="p">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Illum sunt non quas quod numquam fugit sequi officiis rerum.
            </p>

            <div>
                <button class="btn">Login</button>
                <button class="btn1">Sign up</button>
            </div>
        </div>

        <div class="right">
            <img
                class="image"
                src="../../asset/image.png"
                alt="Code with Yamini"
            >
        </div>

    </div>
</body>
</html>
