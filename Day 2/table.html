<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
</head>
<body>
    <h1>Student Details</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Yamini</td>
            <td>Java</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Ram</td>
            <td>HTML</td>
            <td>85</td>
        </tr>
    </table><br>


    <table border="1">
    <tr>
        <th colspan="2">Student Information</th>
    </tr>
    <tr>
        <td>Name</td>
        <td>Yamini</td>
    </tr>
    </table><br>

    <table border="1">
    <tr>
        <th rowspan="2">Yamini</th>
        <td>Java</td>
    </tr>
    <tr>
        <td>HTML</td>
    </tr>
    </table>




    
</body>
</html>
