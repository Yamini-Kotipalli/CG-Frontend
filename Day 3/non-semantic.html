
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Div and Span</title>
    <style>
        .card {
            background-color: lightblue;
            padding: 15px;
            margin-bottom: 10px;
        }

        .highlight {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>HTML</h2>
        <p>HTML defines webpage structure.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>CSS styles webpage content.</p>
    </div>

    <p>
        I am learning
        <span class="highlight">Frontend Development</span>.
    </p>
</body>
</html>
