
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors and Text</title>

    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 3px lightgray;
        }

        h2 {
            color: rgb(0, 128, 0);
            text-align: left;
        }

        p {
            color: #333333;
            font-size: 18px;
            line-height: 1.6;
            word-spacing: 3px;
        }

        .highlight {
            background-color: lightyellow;
            font-weight: bold;
            font-style: italic;
        }

        a {
            color: blue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS</h1>

    <h2>Colors and Backgrounds</h2>

    <p>
        CSS allows us to change the colors, backgrounds,
        fonts, and alignment of HTML elements.
    </p>

    <p class="highlight">
        Practice CSS every day to improve your skills.
    </p>

    <a href="https://developer.mozilla.org/en-US/docs/Web/CSS">
        Learn CSS
    </a>

</body>
</html>
